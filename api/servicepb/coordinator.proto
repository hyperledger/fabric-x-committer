// DeleteDBCloneForSnapshot is not an AIP-135 resource delete: it drops the database
// clone of a snapshot identified by its transaction ID, and the request message is
// committerpb.DeleteDBCloneForSnapshotRequest (defined in fabric-x-common), which has
// no `name` field to annotate.
// (-- api-linter: core::0135::method-signature=disabled --)

syntax = "proto3";

option go_package = "github.com/hyperledger/fabric-x-committer/api/servicepb";

package servicepb;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

import "api/committerpb/status.proto";
import "api/committerpb/ref.proto";
import "api/committerpb/sidecar.proto";

import "api/servicepb/common.proto";

service Coordinator {
    rpc BlockProcessing(stream CoordinatorBatch) returns (stream servicepb.TxStatusBatch);
    rpc SetLastCommittedBlockNumber (BlockRef) returns (google.protobuf.Empty) {};
    rpc GetNextBlockNumberToCommit (google.protobuf.Empty) returns (BlockRef) {};
    rpc GetTransactionsStatus(committerpb.TxIDsBatch) returns (servicepb.TxStatusBatch);
    rpc NoPendingTransactionProcessing(google.protobuf.Empty) returns (google.protobuf.BoolValue);

    // Drops the database clone of the snapshot named by tx_id and clears the clone name from
    // its _snapshot row. Admin-triggered: forwarded verbatim from the sidecar to a vcservice.
    rpc DeleteDBCloneForSnapshot(committerpb.DeleteDBCloneForSnapshotRequest) returns (google.protobuf.Empty);
}

// A committer's representation of a block in the blockchain.
message CoordinatorBatch {
    repeated servicepb.TxWithRef txs = 1;       // List of transactions within the block.
    repeated committerpb.TxStatus rejected = 2; // Rejected transactions.
}
